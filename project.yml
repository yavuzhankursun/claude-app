# XcodeGen tanımı: `make project` → Monster.xcodeproj (üretilen proje git'e girmez).
name: Monster
options:
  bundleIdPrefix: app.monster
  developmentLanguage: tr
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  MonsterCore:
    path: MonsterCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SDKROOT: macosx          # Kurulu en güncel macOS SDK (Xcode 27.1 → macOS 27 SDK)
targets:
  Monster:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Resources/Monster.entitlements"
    dependencies:
      - package: MonsterCore
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Monster
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: tr
        CFBundleLocalizations: [tr, en]
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "Monster — Claude Code için kişisel macOS istemcisi"
    entitlements:
      path: App/Resources/Monster.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.monster.Monster
        PRODUCT_NAME: Monster
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"            # yerel; dağıtımda "Developer ID Application" (make release)
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO             # ADR-0005
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEAD_CODE_STRIPPING: YES
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
          SWIFT_COMPILATION_MODE: wholemodule
schemes:
  Monster:
    build:
      targets:
        Monster: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: MonsterCore/MonsterCoreTests
    profile:
      config: Release
