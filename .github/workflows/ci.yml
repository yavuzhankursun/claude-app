name: CI
on:
  push:
  pull_request:

jobs:
  core:
    name: MonsterCore tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift --version
      - run: cd MonsterCore && swift test

  app:
    name: Monster.app build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - run: xcodegen generate --spec project.yml
      - run: >
          xcodebuild build -project Monster.xcodeproj -scheme Monster -configuration Debug
          -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
